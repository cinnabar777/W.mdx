plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wmdx.markdownapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.wmdx.markdownapp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

task buildWebAssets(type: Exec) {
    workingDir "$projectDir/.."
    commandLine 'node', 'web/build.cjs'
}

preBuild.dependsOn buildWebAssets

task testEditorBridge(type: Exec) {
    workingDir "$projectDir/.."
    commandLine 'node', '--test', 'web/test/native-bridge.test.cjs'
}
preBuild.dependsOn testEditorBridge

tasks.matching { it.name == 'assembleDebug' }.configureEach {
    dependsOn 'testDebugUnitTest'
}

// Both existing GitHub workflows build through these tasks. Verify the APK
// after packaging, without adding SDK/unzip requirements to developers' builds.
tasks.matching { it.name in ['assembleDebug', 'assembleRelease'] }.configureEach { assembleTask ->
    doLast {
        if (System.getenv('GITHUB_ACTIONS') == 'true') {
            def variant = assembleTask.name == 'assembleDebug' ? 'debug' : 'release'
            def packageId = android.defaultConfig.applicationId + (variant == 'debug' ? '.debug' : '')
            def appLabel = variant == 'debug' ? 'Wmdx-debug' : 'Wmdx'
            project.exec {
                workingDir rootProject.projectDir
                environment 'ANDROID_HOME', android.sdkDirectory.absolutePath
                commandLine 'node', 'tools/verify-apk-icons.cjs',
                    "${project.buildDir}/outputs/apk/${variant}/app-${variant}.apk",
                    packageId, appLabel
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.caverock:androidsvg-aar:1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
