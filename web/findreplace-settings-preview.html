<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./findreplace.css">
  <link rel="stylesheet" href="./icon-picker.css">
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none;
    }
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body { color: #fff; font-family: system-ui, sans-serif; }
    .findreplace-preview-card {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 9px;
      background: #000;
    }
    .findreplace-preview-hint {
      padding: 7px 9px 4px;
      color: #888;
      font-size: 11px;
    }
    .findreplace-preview-card .search-bar-container {
      z-index: auto !important;
      box-shadow: none !important;
    }
    .findreplace-preview-hidden-tray {
      margin: 0 10px 10px;
      padding: 7px;
      border: 1px dashed #383838;
      border-radius: 6px;
      background: #181818;
    }
    .findreplace-preview-hidden-tray.drag-over {
      border-color: #0078d4;
      background: rgba(0,120,212,.12);
    }
    .findreplace-preview-hidden-label {
      margin-bottom: 5px;
      color: #888;
      font-size: 11px;
    }
    .findreplace-preview-empty-hidden {
      padding: 4px 0;
      color: #888;
      font-size: 11px;
    }
    .findreplace-preview-hidden-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 16px;
    }
    .findreplace-preview-hidden-button {
      padding: 4px 7px;
      border: 0;
      border-radius: 3px;
      color: #fff;
      background: #0078d4;
      font: inherit;
      font-size: 11px;
    }
    .search-icon-btn.dragging { opacity: .35; }
    .search-icon-btn { touch-action: none; }
    .findreplace-drop-marker {
      display: block;
      width: 3px;
      min-width: 3px;
      flex: 0 0 3px;
      margin: 0 2px;
      border-radius: 2px;
      background: #00d7c8;
      box-shadow: 0 0 5px rgba(0,215,200,.55);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="findreplace-preview-card">
    <div class="findreplace-preview-hint">Tap a field or button to edit it · hold and drag buttons to rearrange</div>
    <div id="custom-search-bar" class="search-bar-container">
      <div class="search-bar-row">
        <input id="search-input" class="search-input" type="text" placeholder="Find..." readonly aria-label="Find field settings">
        <span id="search-counter" class="search-counter">1/12</span>
        <span id="search-error-msg" class="search-error-msg hidden"></span>
        <div id="findreplace-row1" class="search-icon-group">
          <button id="search-btn-prev" class="search-icon-btn" data-button-id="prev" data-icon-key="findPrevious" data-category="category_btn_prev" title="Find Previous" aria-label="Find Previous"></button>
          <button id="search-btn-next" class="search-icon-btn" data-button-id="next" data-icon-key="findNext" data-category="category_btn_next" title="Find Next" aria-label="Find Next"></button>
          <button id="search-btn-highlight" class="search-icon-btn active" data-button-id="highlight" data-icon-key="findHighlight" data-category="category_btn_highlight" title="Highlight All Instances" aria-label="Highlight All Instances"></button>
          <button id="search-btn-regex" class="search-icon-btn" data-button-id="regex" data-icon-key="findRegex" data-category="category_btn_regex" title="Regular Expression" aria-label="Regular Expression"></button>
          <button id="search-btn-close" class="search-icon-btn" data-button-id="close" data-icon-key="findClose" data-category="category_btn_close" title="Close Search" aria-label="Close Search"></button>
        </div>
      </div>
      <div id="search-replace-row" class="search-bar-row replace-row">
        <input id="replace-input" class="search-input" type="text" placeholder="Replace..." readonly aria-label="Replace field settings">
        <div id="findreplace-row2" class="search-icon-group">
          <button id="search-btn-replace-one" class="search-icon-btn" data-button-id="replace-one" data-icon-key="replaceOne" data-category="category_btn_replace_one" title="Replace One" aria-label="Replace One"></button>
          <button id="search-btn-replace-all" class="search-icon-btn" data-button-id="replace-all" data-icon-key="replaceAll" data-category="category_btn_replace_all" title="Replace All" aria-label="Replace All"></button>
          <button id="search-btn-case" class="search-icon-btn" data-button-id="case" data-icon-key="matchCase" data-category="category_btn_case" title="Match Case" aria-label="Match Case"></button>
          <button id="search-btn-word" class="search-icon-btn" data-button-id="word" data-icon-key="wholeWord" data-category="category_btn_word" title="Match Whole Word" aria-label="Match Whole Word"></button>
        </div>
      </div>
    </div>
    <div id="findreplace-hidden-tray" class="findreplace-preview-hidden-tray">
      <div class="findreplace-preview-hidden-label">Hidden buttons — drag here to remove; tap to restore</div>
      <div id="findreplace-hidden-buttons" class="findreplace-preview-hidden-buttons"></div>
    </div>
  </div>
  <div id="findreplace-icon-picker-modal" class="toolbar-preview-icon-picker-modal" hidden aria-hidden="true">
    <section class="toolbar-preview-icon-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="findreplace-icon-picker-title">
      <header class="toolbar-preview-icon-picker-header">
        <h2 id="findreplace-icon-picker-title">Choose icon</h2>
        <button id="findreplace-icon-picker-close" class="toolbar-preview-icon-picker-close" type="button" aria-label="Close icon picker">×</button>
      </header>
      <input id="findreplace-icon-search" class="toolbar-preview-icon-search" type="search" placeholder="Search available icons…" aria-label="Search app icons">
      <div class="toolbar-preview-icon-actions">
        <button id="findreplace-paste-svg" type="button">Paste SVG</button>
        <button id="findreplace-choose-svg" type="button">Choose SVG file</button>
      </div>
      <div class="toolbar-preview-section-label">Available icons</div>
      <div id="findreplace-icon-list" class="toolbar-preview-icon-list" role="listbox" aria-label="Available app icons"></div>
    </section>
  </div>
  <script src="./findreplace-settings.js"></script>
</body>
</html>
