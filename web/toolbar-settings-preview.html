<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./toolbar.css">
  <style>
    :root {
      color-scheme: dark;
      --toolbar-bg: #121212;
      --toolbar-icon-color: #fff;
      --toolbar-height: 48px;
      --button-hover: rgba(255, 255, 255, 0.16);
    }
    * { box-sizing: border-box; }
    html,
    body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      background: #000;
      font-family: system-ui, sans-serif;
    }
    .toolbar-preview-status {
      min-height: 16px;
      padding-top: 5px;
      color: #70dba2;
      font-size: 11px;
    }
    .toolbar-preview-editor {
      display: none;
      position: fixed;
      z-index: 10006;
      left: 12px;
      right: 12px;
      bottom: calc(var(--toolbar-height, 48px) + 10px);
      margin: 0;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      background: #171717;
      box-shadow: 0 10px 28px rgba(0,0,0,.75);
    }
    .toolbar-preview-editor.visible { display: block; }
    .toolbar-preview-editor.above-group {
      bottom: calc(var(--toolbar-height, 48px) + 78px);
    }
    .toolbar-preview-editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 6px;
    }
    .toolbar-preview-editor h2 {
      flex: 1;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toolbar-preview-editor-close {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      color: inherit;
      background: rgba(255,255,255,.08);
      font: inherit;
      font-size: 18px;
    }
    .toolbar-preview-editor-reset-all {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      color: inherit;
      background: rgba(255,255,255,.08);
    }
    .toolbar-preview-editor-reset-all svg {
      width: 17px;
      height: 17px;
    }
    .toolbar-preview-editor-reset-all:disabled {
      opacity: .38;
    }
    .toolbar-preview-editor-content { display: block; }
    .toolbar-preview-style-controls { display: grid; gap: 3px; }
    .toolbar-preview-color-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      margin: 0;
      font-size: 12px;
    }
    .toolbar-preview-color-row button {
      width: 30px;
      height: 24px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 6px;
      background: transparent;
    }
    .toolbar-preview-reset-color {
      display: grid;
      width: 26px !important;
      height: 26px !important;
      place-items: center;
      border: 0 !important;
      color: inherit;
      background: transparent !important;
    }
    .toolbar-preview-reset-color svg {
      width: 16px;
      height: 16px;
    }
    .toolbar-preview-reset-color:disabled {
      opacity: .38;
    }
    .toolbar-preview-current-key {
      display: grid;
      width: 32px;
      height: 30px;
      flex: 0 0 32px;
      place-items: center;
      padding: 3px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 7px;
      color: var(--toolbar-icon-color);
      background: transparent;
    }
    .toolbar-preview-current-key.active {
      background: var(--toolbar-key-active-bg-color, var(--toolbar-key-bg-color, transparent));
    }
    .toolbar-preview-icon-option-preview {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
    }
    .toolbar-preview-icon-option-preview svg {
      width: 21px;
      height: 21px;
    }
    .toolbar-preview-header-action {
      min-width: 34px;
      height: 30px;
      flex: 0 0 auto;
      padding: 0 6px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 7px;
      color: inherit;
      background: rgba(255,255,255,.08);
      font: inherit;
      font-size: 11px;
    }
    .toolbar-preview-preserve-colors {
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      min-height: 21px;
      align-items: center;
      gap: 5px;
      margin: 0;
      padding: 1px 6px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 6px;
      color: inherit;
      background: rgba(255,255,255,.05);
      font-size: 10px;
    }
    .toolbar-preview-preserve-colors input {
      width: 14px;
      height: 14px;
      margin: 0;
    }
    .toolbar-preview-icon-picker { display: none; }
    .toolbar-preview-editor.icon-picker-open .toolbar-preview-style-controls { display: none; }
    .toolbar-preview-editor.icon-picker-open .toolbar-preview-icon-picker { display: block; }
    .toolbar-preview-icon-picker-back {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      color: inherit;
      background: rgba(255,255,255,.08);
      font: inherit;
      font-size: 20px;
    }
    .toolbar-preview-icon-search {
      width: 100%;
      height: 30px;
      margin: 0 0 4px;
      padding: 0 9px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 7px;
      color: inherit;
      background: rgba(255,255,255,.06);
      font: inherit;
      font-size: 12px;
    }
    .toolbar-preview-icon-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 6px;
      max-height: min(34vh, 280px);
      overflow: auto;
      padding: 4px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 7px;
      overscroll-behavior: contain;
    }
    .toolbar-preview-icon-choice {
      display: flex;
      min-width: 0;
      min-height: 58px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      overflow: hidden;
      padding: 3px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 11px;
    }
    .toolbar-preview-icon-choice[aria-pressed="true"] {
      border-color: currentColor;
      background: rgba(255,255,255,.1);
    }
    .toolbar-preview-icon-choice svg {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
    }
    .toolbar-preview-icon-choice span {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toolbar-preview-status {
      min-height: 0;
      margin-top: 6px;
      color: #70dba2;
      font-size: 11px;
    }
    .toolbar-preview-tray-label {
      margin: 0 0 6px;
      color: rgba(255,255,255,.68);
      font-size: 11px;
    }
    body.light-theme .toolbar-preview-editor {
      color: #111;
      border-color: rgba(0,0,0,.2);
      background: #f5f5f5;
      box-shadow: 0 10px 28px rgba(0,0,0,.24);
    }
    body.light-theme .toolbar-preview-editor-close {
      border-color: rgba(0,0,0,.2);
      background: rgba(0,0,0,.06);
    }
    body.light-theme .toolbar-preview-editor-reset-all,
    body.light-theme .toolbar-preview-header-action {
      border-color: rgba(0,0,0,.2);
      background: rgba(0,0,0,.06);
    }
    body.light-theme .toolbar-preview-current-key {
      border-color: rgba(0,0,0,.2);
      background: var(--toolbar-key-active-bg-color, var(--toolbar-key-bg-color, transparent));
    }
    body.light-theme .toolbar-preview-preserve-colors {
      border-color: rgba(0,0,0,.18);
      background: rgba(0,0,0,.04);
    }
    body.light-theme .toolbar-preview-icon-picker-back {
      border-color: rgba(0,0,0,.2);
      background: rgba(0,0,0,.06);
    }
    body.light-theme .toolbar-preview-icon-search,
    body.light-theme .toolbar-preview-icon-list {
      border-color: rgba(0,0,0,.2);
      background-color: rgba(0,0,0,.04);
    }
    body.light-theme .toolbar-preview-icon-choice[aria-pressed="true"] {
      background: rgba(0,0,0,.08);
    }
    @media (max-height: 620px) {
      .toolbar-preview-icon-list { max-height: 180px; }
      .toolbar-preview-editor { padding: 9px; }
    }
    body.light-theme .toolbar-preview-tray-label {
      color: rgba(0,0,0,.62);
    }
  </style>
</head>
<body>
  <main class="toolbar-preview-shell">
    <div class="toolbar-preview-content">
      <div class="toolbar-preview-tray-label">Holding area · tap a key to customize it; hold and drag to restore it</div>
      <div id="toolbar-holding-tray" class="toolbar-preview-tray" aria-label="Hidden toolbar keys"></div>
      <div class="toolbar-preview-layout-actions">
        <button id="toolbar-reset-layout" type="button">Restore default layout</button>
        <button id="toolbar-add-custom" type="button" disabled>Add custom</button>
      </div>
      <div class="toolbar-preview-status" id="toolbar-preview-status" aria-live="polite"></div>
    </div>
    <div class="toolbar-preview-dock">
      <div class="toolbar-preview-stage">
        <div id="toolbar-preview" class="grouped-control-bar" aria-label="Bottom toolbar preview"></div>
      </div>
      <div id="toolbar-preview-popup" class="popup-toolbar-strip hidden" aria-label="Toolbar group popup"></div>
    </div>
    <section
      id="toolbar-preview-editor"
      class="toolbar-preview-editor"
      role="dialog"
      aria-labelledby="toolbar-preview-selected-title"
      aria-hidden="true">
      <div class="toolbar-preview-editor-header">
        <button id="toolbar-icon-picker-back" class="toolbar-preview-icon-picker-back" type="button" aria-label="Back to key settings" hidden>‹</button>
        <h2 id="toolbar-preview-selected-title">Selected key</h2>
        <button id="toolbar-open-icon-picker" class="toolbar-preview-current-key active" type="button" aria-label="Choose built-in icon" title="Choose built-in icon">
          <span id="toolbar-current-icon" class="toolbar-preview-icon-option-preview" aria-hidden="true"></span>
        </button>
        <button id="toolbar-paste-svg" class="toolbar-preview-header-action" type="button" aria-label="Paste SVG" title="Paste SVG">Paste</button>
        <button id="toolbar-choose-svg" class="toolbar-preview-header-action" type="button" aria-label="Choose SVG file" title="Choose SVG file">File</button>
        <button id="toolbar-reset-key-style" class="toolbar-preview-editor-reset-all" type="button" aria-label="Reset all settings for this key" title="Reset all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="toolbar-preview-close-editor" class="toolbar-preview-editor-close" type="button" aria-label="Close key settings">×</button>
      </div>
      <div class="toolbar-preview-editor-content">
        <div class="toolbar-preview-style-controls">
          <div class="toolbar-preview-color-settings">
            <div class="toolbar-preview-color-row">
              <span>Icon color</span>
              <button id="toolbar-icon-color" type="button" aria-label="Change icon color"></button>
              <button class="toolbar-preview-reset-color" data-reset-property="iconColor" type="button" aria-label="Reset icon color"></button>
            </div>
            <div class="toolbar-preview-color-row">
              <span>Key background</span>
              <button id="toolbar-background-color" type="button" aria-label="Change key background color"></button>
              <button class="toolbar-preview-reset-color" data-reset-property="backgroundColor" type="button" aria-label="Reset key background color"></button>
            </div>
            <div class="toolbar-preview-color-row">
              <span>Active background</span>
              <button id="toolbar-active-background-color" type="button" aria-label="Change active key background color"></button>
              <button class="toolbar-preview-reset-color" data-reset-property="activeBackgroundColor" type="button" aria-label="Reset active background color"></button>
            </div>
          </div>
          <label class="toolbar-preview-preserve-colors">
            <input id="toolbar-preserve-svg-colors" type="checkbox">
            Preserve icon colors
          </label>
        </div>
        <div class="toolbar-preview-icon-picker">
          <input id="toolbar-icon-search" class="toolbar-preview-icon-search" type="search" placeholder="Search icons…" aria-label="Search app icons">
          <div id="toolbar-icon-list" class="toolbar-preview-icon-list" role="listbox" aria-label="Available app icons"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="./toolbar-settings.js"></script>
</body>
</html>
