name: Build Debug APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web Bundle
        run: |
          node web/build.cjs

      - name: Run focused Markdown conversion and paste tests
        working-directory: web
        run: |
          node --test \
            test/markdown-conversion.test.cjs \
            test/html-export.test.cjs \
            test/markdown-compatibility-matrix.test.cjs \
            test/gfm-spec-extensions.test.cjs \
            test/markdown-paste.test.cjs

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run focused list caret regression
        working-directory: web
        run: npm run test:browser:list-caret

      - name: Run exposed table scroll regression
        working-directory: web
        run: npm run test:browser:table-syntax-scroll

      - name: Run source table, quote, list, and callout interaction regressions
        working-directory: web
        run: npm run test:browser:interactions

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run backup-default preference test
        run: ./gradlew testDebugUnitTest --tests com.wmdx.markdownapp.AppPreferenceDefaultsTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wmdx-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
