name: Build Debug APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web Bundle
        run: |
          node web/build.cjs

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Web Unit Tests
        run: npm --prefix web test

      - name: Run Browser Layout Tests
        run: npm --prefix web run test:browser

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK & Run Unit Tests
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wmdx-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Run Android WebView Interaction Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 4
          disable-animations: true
          emulator-boot-timeout: 1200
          script: sh scripts/run-android-webview-tests.sh

      - name: Upload Android WebView test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-WebView-Test-Diagnostics
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            app/build/diagnostics/android-webview-logcat.txt
          if-no-files-found: ignore
