name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  build-signed-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web Bundle
        run: |
          node web/build.cjs

      - name: Run focused Markdown conversion and paste tests
        working-directory: web
        run: |
          node --test \
            test/markdown-conversion.test.cjs \
            test/html-export.test.cjs \
            test/markdown-compatibility-matrix.test.cjs \
            test/gfm-spec-extensions.test.cjs \
            test/markdown-paste.test.cjs \
            test/markdown-html-rendering.test.cjs

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > release.keystore

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wmdx-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore
