name: Focused Editor Regressions

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select one editor regression
        type: choice
        required: true
        default: list-caret
        options:
          - list-caret
          - tables

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Bundle
        working-directory: web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run list caret and wrapping regression
        if: inputs.suite == 'list-caret'
        working-directory: web
        run: npm run test:browser:list-caret

      - name: Run existing table regression
        if: inputs.suite == 'tables'
        working-directory: web
        run: npm run test:browser:tables
