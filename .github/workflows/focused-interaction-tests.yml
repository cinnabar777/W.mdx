name: Focused Editor Regressions

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Select one focused regression
        type: choice
        required: true
        default: list-caret
        options:
          - list-caret
          - tables
          - interactions
          - commonmark-html
      commonmark_cases:
        description: Optional comma-separated CommonMark example numbers; blank runs all 575
        type: string
        required: false
        default: ''

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Run CommonMark HTML import/export parity
        if: inputs.suite == 'commonmark-html'
        working-directory: web
        env:
          COMMONMARK_CASES: ${{ inputs.commonmark_cases }}
        run: node --test test/commonmark-html-parity.test.cjs

      - name: Build Web Bundle
        if: inputs.suite != 'commonmark-html'
        working-directory: web
        run: npm run build

      - name: Install Playwright Chromium
        if: inputs.suite != 'commonmark-html'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run list caret and wrapping regression
        if: inputs.suite == 'list-caret'
        working-directory: web
        run: npm run test:browser:list-caret

      - name: Run existing table regression
        if: inputs.suite == 'tables'
        working-directory: web
        run: npm run test:browser:tables

      - name: Run source-table, quote, list, and callout interaction regressions
        if: inputs.suite == 'interactions'
        working-directory: web
        run: npm run test:browser:interactions
