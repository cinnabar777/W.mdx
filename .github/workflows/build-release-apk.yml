name: Build Release APK (Debug Key)

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web Bundle
        run: |
          node web/build.cjs

      - name: Run focused Markdown conversion and paste tests
        working-directory: web
        run: |
          node --test \
            test/markdown-conversion.test.cjs \
            test/html-export.test.cjs \
            test/markdown-compatibility-matrix.test.cjs \
            test/gfm-spec-extensions.test.cjs \
            test/markdown-paste.test.cjs \
            test/markdown-html-rendering.test.cjs

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wmdx-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
